name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsdown.config.ts'
      - 'scripts/postbuild.js'
      - 'vitest.config.ts'
      - 'eslint.config.js'
      - '.github/workflows/**'
      - 'atlas/**'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/astro.config.mjs'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsdown.config.ts'
      - 'scripts/postbuild.js'
      - 'vitest.config.ts'
      - 'eslint.config.js'
      - '.github/workflows/**'
      - 'atlas/**'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'site/astro.config.mjs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # PH-AHG-002: cap wall-clock so a hung install/test can't burn the
    # default 6h of CI minutes. 15m is generous for ci + typecheck + tests.
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The toolchain runs on Node 22 in every cell: tsdown requires Node
      # >=22.18 and Atlas >=22. The matrix version is the runtime the tests
      # run on, set up after the build.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      # The committed map is the same in every cell; check it once.
      - name: Atlas check
        if: matrix.node-version == 22
        run: npx --yes @dogfood-lab/atlas@1.14.0 check

      - run: npm ci
      # PH-AHG-003: audit is advisory (continue-on-error), but the signal
      # used to be invisible — a nameless step with no surfaced output. Name
      # it and write the findings to the run's Step Summary so an operator
      # can see vulnerabilities without the step failing the build.
      - name: npm audit (advisory — does not fail the build)
        continue-on-error: true
        run: |
          echo '### npm audit (advisory)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=moderate 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint

      # Runtime under test. better-sqlite3 is a native addon compiled for the
      # Node that installed it, so it is rebuilt for this one.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: matrix.node-version != 22
        with:
          node-version: ${{ matrix.node-version }}
      - if: matrix.node-version != 22
        run: npm rebuild better-sqlite3
      # dist/ is built above. --ignore-scripts skips pretest's rebuild, so the
      # tests run those bundles on the matrix runtime.
      - run: npm test --ignore-scripts
